name: Lint contracts

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Spectral (OpenAPI + AsyncAPI)
        run: npx --yes @stoplight/spectral-cli@6.11.1 lint openapi/*.yaml asyncapi/*.yaml --fail-severity=warn
      - name: docker compose config
        run: docker compose config --quiet
